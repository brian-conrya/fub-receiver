steps:
  # Format check
  - name: 'golang:1.26.9'
    id: 'fmt-check'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted"
          exit 1
        fi
    timeout: "60s"

  # Static analysis
  - name: 'golang:1.26.9'
    id: 'vet'
    entrypoint: 'go'
    args: ['vet', './...']
    timeout: "120s"

  # Linter
  - name: 'golang:1.26.9'
    id: 'lint'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 && golangci-lint run ./...'
    timeout: "300s"

  # Unit tests with race detector
  - name: 'golang:1.26.9'
    id: 'test'
    entrypoint: 'go'
    args: ['test', '-race', '-shuffle=on', '-count=1', './...']
    timeout: "300s"

  # Vulnerability scan
  - name: 'golang:1.26.9'
    id: 'vuln'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...'
    timeout: "180s"

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-build'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/containers/fub-receiver:$COMMIT_SHA', '.']

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'docker-push'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/containers/fub-receiver:$COMMIT_SHA']

  # Update the Cloud Run service image. --revision-suffix tags the new revision
  # with the short commit SHA so rollback in the Cloud Run console is unambiguous.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'fub-receiver'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/containers/fub-receiver:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--revision-suffix=sha-$SHORT_SHA'
      - '--quiet'

options:
  logging: CLOUD_LOGGING_ONLY
