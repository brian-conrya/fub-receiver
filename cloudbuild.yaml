steps:
  # Run unit tests
  - name: 'golang'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        go test ./...
        if [ $? -ne 0 ]; then
          echo "Tests failed. Aborting build."
          exit 1
        fi
    timeout: "300s"

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/fub-receiver/fub-receiver:$COMMIT_SHA', '.']

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/fub-receiver/fub-receiver:$COMMIT_SHA']


options:
  logging: CLOUD_LOGGING_ONLY
