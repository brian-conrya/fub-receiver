name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Dependabot bumps the Dockerfile's golang image on its own, which would
      # leave production building with a different Go than CI tests with.
      - name: Go versions agree
        run: |
          mod=$(sed -n 's/^toolchain go//p' go.mod)
          docker=$(sed -n 's/^FROM golang:\([0-9.]*\)-.*/\1/p' Dockerfile)
          cloudbuild=$(sed -n "s/.*name: 'golang:\([0-9.]*\)'.*/\1/p" cloudbuild.yaml | sort -u)
          echo "go.mod toolchain: $mod"
          echo "Dockerfile:       $docker"
          echo "cloudbuild.yaml:  $cloudbuild"
          if [ -z "$mod" ] || [ "$mod" != "$docker" ] || [ "$mod" != "$cloudbuild" ]; then
            echo "::error::Go versions differ. Set the same version in go.mod (toolchain), Dockerfile, and cloudbuild.yaml."
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: test
        run: go test -race -shuffle=on -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
